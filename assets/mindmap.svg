<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>

  <!-- 连接线：中心 -> 三个分支头 -->
  <line x1="450" y1="94" x2="160" y2="170" stroke="#b8c2cc" stroke-width="2.5"/>
  <line x1="450" y1="94" x2="450" y2="170" stroke="#b8c2cc" stroke-width="2.5"/>
  <line x1="450" y1="94" x2="740" y2="170" stroke="#b8c2cc" stroke-width="2.5"/>

  <!-- 各分支脊柱线 -->
  <line x1="160" y1="212" x2="160" y2="488" stroke="#e8743b" stroke-width="2"/>
  <line x1="450" y1="212" x2="450" y2="374" stroke="#2a9d8f" stroke-width="2"/>
  <line x1="740" y1="212" x2="740" y2="374" stroke="#7b5ea7" stroke-width="2"/>

  <!-- 分支头：第一档 -->
  <rect x="55" y="170" width="210" height="42" rx="10" fill="#e8743b"/>
  <text x="160" y="191" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-size="15" font-weight="bold">第一档·近期必精通</text>

  <!-- 分支头：第二档 -->
  <rect x="345" y="170" width="210" height="42" rx="10" fill="#2a9d8f"/>
  <text x="450" y="191" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-size="15" font-weight="bold">第二档·中期夯实</text>

  <!-- 分支头：作品集 -->
  <rect x="635" y="170" width="210" height="42" rx="10" fill="#7b5ea7"/>
  <text x="740" y="191" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-size="15" font-weight="bold">作品集</text>

  <!-- 第一档 叶子 -->
  <g fill="#fbe9e0" stroke="#e8743b" stroke-width="1.2">
    <rect x="60" y="222" width="200" height="30" rx="8"/>
    <rect x="60" y="260" width="200" height="30" rx="8"/>
    <rect x="60" y="298" width="200" height="30" rx="8"/>
    <rect x="60" y="336" width="200" height="30" rx="8"/>
    <rect x="60" y="374" width="200" height="30" rx="8"/>
    <rect x="60" y="412" width="200" height="30" rx="8"/>
    <rect x="60" y="450" width="200" height="30" rx="8"/>
    <rect x="60" y="488" width="200" height="30" rx="8"/>
  </g>
  <g fill="#5a2a12" font-size="13" text-anchor="middle" dominant-baseline="middle">
    <text x="160" y="237">等保 2.0</text>
    <text x="160" y="275">OWASP Top10</text>
    <text x="160" y="313">密评</text>
    <text x="160" y="351">WSTG</text>
    <text x="160" y="389">PTES</text>
    <text x="160" y="427">MITRE ATT&amp;CK</text>
    <text x="160" y="465">数据安全法 / PIPL</text>
    <text x="160" y="503">CVSS / CWE</text>
  </g>

  <!-- 第二档 叶子 -->
  <g fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.2">
    <rect x="350" y="222" width="200" height="30" rx="8"/>
    <rect x="350" y="260" width="200" height="30" rx="8"/>
    <rect x="350" y="298" width="200" height="30" rx="8"/>
    <rect x="350" y="336" width="200" height="30" rx="8"/>
    <rect x="350" y="374" width="200" height="30" rx="8"/>
  </g>
  <g fill="#13564d" font-size="13" text-anchor="middle" dominant-baseline="middle">
    <text x="450" y="237">ISO 27001</text>
    <text x="450" y="275">NIST CSF</text>
    <text x="450" y="313">护网 HW</text>
    <text x="450" y="351">ASVS</text>
    <text x="450" y="389">关基保护</text>
  </g>

  <!-- 作品集 叶子 -->
  <g fill="#efeaf6" stroke="#7b5ea7" stroke-width="1.2">
    <rect x="640" y="222" width="200" height="30" rx="8"/>
    <rect x="640" y="260" width="200" height="30" rx="8"/>
    <rect x="640" y="298" width="200" height="30" rx="8"/>
    <rect x="640" y="336" width="200" height="30" rx="8"/>
    <rect x="640" y="374" width="200" height="30" rx="8"/>
  </g>
  <g fill="#3d2a5a" font-size="13" text-anchor="middle" dominant-baseline="middle">
    <text x="740" y="237">CTF-Writeups</text>
    <text x="740" y="275">Pentest-Reports</text>
    <text x="740" y="313">Incident-Response</text>
    <text x="740" y="351">Study-Roadmap</text>
    <text x="740" y="389">Asset-Collection</text>
  </g>

  <!-- 中心节点 -->
  <rect x="340" y="40" width="220" height="54" rx="14" fill="#1f3a5f"/>
  <text x="450" y="67" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-size="20" font-weight="bold">安服学习流程</text>
</svg>
